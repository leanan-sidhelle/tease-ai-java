plugins {
    id "java"
    //TODO:WHY THE FLYING FUCK DID THE GIT VERSIONER PLUGIN FUCKING STOP WORKING!!!!
    //TODO:plugin for license checks and formatting...
}

group="com.github.leanan.sidhelle"
version="0.0.1"

repositories {
    mavenCentral()
}

dependencies {
    constraints {
        implementation "org.springframework.statemachine:spring-statemachine-starter:3.2.1"
        implementation "org.springframework.boot:spring-boot-starter:3.2.12" //TODO:is there a newer version that is compatible with statemachine?
        implementation "org.springframework.boot:spring-boot-starter-test:3.2.12"
        implementation "org.junit.platform:junit-platform-launcher:6.0.1"
        implementation "ch.qos.logback:logback-classic:1.5.21"
        implementation "org.apache.logging.log4j:log4j-to-slf4j:2.25.2"
        implementation "org.slf4j:jul-to-slf4j:2.0.17"
    }
}

testing {
    suites {
        test {
            useJUnitJupiter("5.12.1")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
